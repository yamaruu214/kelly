<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelly">
<meta name="theme-color" content="#0a0a0a">
<title>Kelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a0a'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='100' font-style='italic' font-weight='700' text-anchor='middle' fill='%23d4ff00'%3EK%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a;
    --bg-2: #141414;
    --ink: #f4f1ea;
    --ink-dim: #8a857a;
    --accent: #d4ff00;
    --danger: #ff5a3c;
    --warn: #ffb84d;
    --line: rgba(244,241,234,0.08);
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(circle at 20% 0%, rgba(212,255,0,0.06), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(255,90,60,0.05), transparent 50%),
      var(--bg);
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.4; z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  }
  header {
    padding: 24px 22px 12px;
    position: relative; z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .logo em { color: var(--accent); font-style: italic; }

  /* Sélecteur de fraction Kelly (en-tête : ne prend aucune place en plus) */
  .picker { display: flex; gap: 6px; }
  .pick {
    appearance: none; -webkit-appearance: none;
    min-width: 46px; height: 42px; padding: 0 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
  }
  .pick:active { transform: scale(0.95); }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0a;
  }

  main {
    flex: 1;
    padding: 8px 22px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative; z-index: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* empêche la carte résultat (overflow:hidden) de se faire écraser quand la page défile */
  main > * { flex-shrink: 0; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
  }
  .field input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    padding: 16px 18px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input:focus {
    border-color: var(--accent);
    background: #1a1a1a;
  }
  .field input::placeholder { color: #3a3a3a; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .result {
    margin-top: 4px;
    background: linear-gradient(180deg, #161616 0%, #0e0e0e 100%);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .result::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }
  .result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .result-value {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--accent);
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .result-value .pct {
    font-size: 28px;
    font-style: italic;
    color: var(--ink-dim);
    font-weight: 400;
  }
  .result.negative .result-value { color: var(--danger); }
  .result.warn .result-value { color: var(--warn); }
  .verdict {
    margin-top: 12px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.4;
    opacity: 0.85;
  }
  .meta {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-item .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-dim);
  }
  .meta-item .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
  }

  /* Outil marge (plus bas, hors de la zone de saisie Kelly) */
  .tool {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tool-head {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }
  .tool-head::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .inwrap { position: relative; }
  .inwrap input { padding-right: 52px; }
  .inwrap .suf {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--ink-dim);
    pointer-events: none;
  }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mcard {
    background: linear-gradient(180deg, #161616 0%, #0e0e0e 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .mcard::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }
  .mcard .result-label { margin-bottom: 6px; }
  .mval {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--accent);
    white-space: nowrap;
  }
  .mval.off { color: var(--ink-dim); }
  .msub {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .msub b { color: var(--ink); font-weight: 500; }
  .mnote {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    text-align: center;
    line-height: 1.5;
  }

  footer {
    padding: 10px 22px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-dim);
    text-align: center;
    position: relative; z-index: 2;
  }
  footer span { color: var(--accent); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result, .field, .tool { animation: rise 0.5s ease-out backwards; }
  .field:nth-child(1) { animation-delay: 0.05s; }
  .field:nth-child(2) { animation-delay: 0.1s; }
  .result { animation-delay: 0.2s; }
  .tool { animation-delay: 0.3s; }

  @media (prefers-reduced-motion: reduce) {
    .result, .field, .tool { animation: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="logo">kelly<em id="logoK">/3</em></div>
  <div class="picker" id="picker" role="group" aria-label="Choisir la fraction de Kelly"></div>
</header>

<main>
  <div class="row">
    <div class="field">
      <label>Cote réf.</label>
      <input id="ref" type="text" inputmode="decimal" placeholder="1,76" autocomplete="off">
    </div>
    <div class="field">
      <label>Cote pariée</label>
      <input id="bet" type="text" inputmode="decimal" placeholder="1,80" autocomplete="off">
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-label" id="resLabel">Mise recommandée · kelly/3</div>
    <div class="result-value"><span id="pct">—</span><span class="pct">%</span></div>
    <div class="verdict" id="verdict">Entre les deux cotes pour calculer.</div>
    <div class="meta" id="meta"></div>
  </div>

  <section class="tool" id="marginTool">
    <div class="tool-head">Retirer la marge</div>

    <div class="row">
      <div class="field">
        <label>Cote affichée</label>
        <input id="mOdd" type="text" inputmode="decimal" placeholder="1,52" autocomplete="off">
      </div>
      <div class="field">
        <label>Marge</label>
        <div class="inwrap">
          <input id="mMargin" type="text" inputmode="decimal" value="12" autocomplete="off">
          <span class="suf">%</span>
        </div>
      </div>
    </div>

    <div class="duo">
      <div class="mcard">
        <div class="result-label">MPTO</div>
        <div class="mval off" id="mptoV">—</div>
        <div class="msub">Opposé <b id="mptoO">—</b></div>
      </div>
      <div class="mcard">
        <div class="result-label">Log</div>
        <div class="mval off" id="logV">—</div>
        <div class="msub">Opposé <b id="logO">—</b></div>
      </div>
    </div>

    <div class="mnote" id="mNote">Cote affichée + marge du marché · marché à 2 issues</div>
  </section>
</main>

<footer id="foot">kelly / 3 · <span>conservateur</span></footer>

<script>
  const $ = id => document.getElementById(id);
  const ref = $('ref'), bet = $('bet');
  const pct = $('pct'), verdict = $('verdict'), result = $('result');
  const meta = $('meta'), resLabel = $('resLabel'), logoK = $('logoK'),
        foot = $('foot'), picker = $('picker');

  const parse = v => {
    if (!v) return NaN;
    return parseFloat(String(v).replace(',', '.'));
  };
  const fmtFR = (n, d=2) => n.toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});

  /* ---------- Choix de la fraction de Kelly ---------- */
  // Pour ajouter une option (ex. 2 ou 4), il suffit de la mettre dans cette liste.
  const FRACTIONS = [3, 4, 6];
  const DEFAULT_K = 3;
  const STORE_KEY = 'kelly.fraction';
  const tagFor = k => k <= 3 ? 'conservateur' : k <= 6 ? 'très conservateur' : 'ultra conservateur';

  function loadK() {
    try {
      const v = parseInt(localStorage.getItem(STORE_KEY), 10);
      if (FRACTIONS.includes(v)) return v;
    } catch (e) {}
    return DEFAULT_K;
  }
  let K = loadK();

  picker.innerHTML = FRACTIONS.map(f =>
    `<button type="button" class="pick" data-k="${f}" aria-label="Kelly sur ${f}" aria-pressed="false">/${f}</button>`
  ).join('');
  picker.addEventListener('click', e => {
    const b = e.target.closest('.pick');
    if (b) setK(parseInt(b.dataset.k, 10));
  });

  function setK(k, save = true) {
    K = k;
    if (save) { try { localStorage.setItem(STORE_KEY, String(k)); } catch (e) {} }
    picker.querySelectorAll('.pick').forEach(b =>
      b.setAttribute('aria-pressed', String(parseInt(b.dataset.k, 10) === k))
    );
    logoK.textContent = '/' + k;
    resLabel.textContent = 'Mise recommandée · kelly/' + k;
    foot.innerHTML = 'kelly / ' + k + ' · <span>' + tagFor(k) + '</span>';
    compute();
  }

  /* ---------- Calcul Kelly (inchangé, fraction variable) ---------- */
  function renderMeta(others, vals) {
    meta.innerHTML = others.map((f, i) =>
      `<div class="meta-item"><span class="k">Kelly/${f}</span><span class="v">${vals ? vals[i] : '—'}</span></div>`
    ).join('');
  }

  function compute() {
    const oRef = parse(ref.value);
    const oBet = parse(bet.value);
    const others = FRACTIONS.filter(f => f !== K);

    result.classList.remove('negative', 'warn');

    if (!oRef || !oBet || oRef <= 1 || oBet <= 1) {
      pct.textContent = '—';
      verdict.textContent = 'Entre les deux cotes pour calculer.';
      renderMeta(others, null);
      return;
    }

    const p = 1 / oRef;
    const q = 1 - p;
    const b = oBet - 1;
    const kellyFull = (b * p - q) / b;

    if (kellyFull <= 0) {
      pct.textContent = '0,00';
      verdict.textContent = 'Aucune value. Ne pas miser : la cote pariée est défavorable.';
      result.classList.add('negative');
      renderMeta(others, others.map(() => fmtFR(0, 2) + ' %'));
      return;
    }

    const stakePct = kellyFull / K * 100;
    // Les seuils d’alerte restent calés sur l’edge (équivalent kelly/3), quelle que soit la fraction choisie
    const refPct = kellyFull / 3 * 100;

    pct.textContent = fmtFR(stakePct, 2);
    renderMeta(others, others.map(f => fmtFR(kellyFull / f * 100, 2) + ' %'));

    if (refPct < 0.5) {
      verdict.textContent = 'Value marginale. Mise très faible — à toi de voir si ça vaut le coup.';
      result.classList.add('warn');
    } else if (refPct > 8) {
      verdict.textContent = 'Edge très élevé. Vérifie tes cotes — méfie-toi des erreurs ou pièges.';
      result.classList.add('warn');
    } else {
      verdict.textContent = 'Value positive. Mise selon Kelly fractionné (÷' + K + ').';
    }
  }

  /* ---------- Retirer la marge d’une cote (marché à 2 issues) ----------
     On entre la cote affichée (ex. 1,60) et la marge du marché M (12 % = overround 112 %).
     L’autre issue affichée est déduite : 1/Oautre = 1 + M − 1/O.
     Cotes vraies, formules du site True Odds :
     • MPTO : Of = n·Oi / (n − M·Oi)  <=>  1/Of = 1/Oi − M/n   (toujours affiché ; ∞ si la proba vraie ≤ 0)
     • Log  : on cherche c tel que Σ(1/Oi)^c = 1, puis Of = Oi^c
              (pas de solution quand 1/Oautre ≥ 1, donc masqué au-delà de ce seuil)          */
  const mOdd = $('mOdd'), mMargin = $('mMargin');
  const mptoV = $('mptoV'), mptoO = $('mptoO'), logV = $('logV'), logO = $('logO'), mNote = $('mNote');
  const N_OUTCOMES = 2;
  const ODD_DEC = 3;
  const NOTE_IDLE = 'Cote affichée + marge du marché · marché à 2 issues';

  // impl = probabilité implicite affichée de l’issue ; renvoie la cote vraie MPTO
  const mptoTrue = (impl, M) => {
    const p = impl - M / N_OUTCOMES;
    return p > 0 ? 1 / p : Infinity;
  };

  function logTrue(o1, o2) {
    const a = 1 / o1, b = 1 / o2;           // a + b = 1 + M > 1, avec b < 1  =>  c > 1
    let lo = 1, hi = 2;
    while (Math.pow(a, hi) + Math.pow(b, hi) > 1 && hi < 1e6) hi *= 2;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      if (Math.pow(a, mid) + Math.pow(b, mid) > 1) lo = mid; else hi = mid;
    }
    const c = (lo + hi) / 2;
    return { c, t1: Math.pow(o1, c), t2: Math.pow(o2, c) };
  }

  const fmtOdd = x => {
    if (x == null || isNaN(x)) return '—';
    if (!isFinite(x) || x >= 100000) return '∞';
    return fmtFR(x, ODD_DEC);
  };

  function setCard(valEl, oppEl, odd, opp) {
    const v = fmtOdd(odd);
    valEl.textContent = v;
    valEl.classList.toggle('off', v === '—');
    // réduit un peu la taille si le nombre est long, pour qu’il reste dans la carte
    valEl.style.fontSize = v.length >= 9 ? '22px' : v.length >= 7 ? '28px' : v.length === 6 ? '34px' : '';
    oppEl.textContent = fmtOdd(opp);
  }

  function computeMargin() {
    const o = parse(mOdd.value);
    const m = parse(mMargin.value);

    if (!o || o <= 1 || isNaN(m) || m < 0) {
      setCard(mptoV, mptoO, null);
      setCard(logV, logO, null);
      mNote.textContent = NOTE_IDLE;
      return;
    }

    const M = m / 100;
    const impO = 1 / o;
    const impOther = 1 + M - impO;           // proba implicite de l’autre issue affichée
    let note = 'Overround ' + fmtFR(100 + m, 2) + ' %';

    // MPTO : toujours affiché
    setCard(mptoV, mptoO, mptoTrue(impO, M), mptoTrue(impOther, M));

    // Log : seulement si une solution existe (autre issue affichée > 1,00) et si le résultat reste raisonnable
    let lg = null;
    if (impOther < 1) {
      const o2 = 1 / impOther;
      note = 'Autre côté affiché ' + fmtFR(o2, ODD_DEC) + ' · ' + note;
      const r = logTrue(o, o2);
      if (isFinite(r.t1) && isFinite(r.t2) && r.t1 < 1000 && r.t2 < 1000) lg = r;
    }
    if (lg) {
      setCard(logV, logO, lg.t1, lg.t2);
      note += '<br>c (log) = ' + fmtFR(lg.c, 6);
    } else {
      setCard(logV, logO, null);
    }
    mNote.innerHTML = note;
  }

  /* ---------- Événements ---------- */
  [ref, bet].forEach(el => {
    el.addEventListener('input', compute);
    el.addEventListener('blur', () => {
      const n = parse(el.value);
      if (!isNaN(n) && el.value) el.value = String(el.value).replace('.', ',');
    });
  });

  [mOdd, mMargin].forEach(el => {
    el.addEventListener('input', computeMargin);
    el.addEventListener('blur', () => {
      const n = parse(el.value);
      if (!isNaN(n) && el.value) el.value = String(el.value).replace('.', ',');
    });
  });
  mMargin.addEventListener('focus', () => setTimeout(() => mMargin.select(), 0));

  setK(K, false);
  computeMargin();
</script>
</body>
</html>
