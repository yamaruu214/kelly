<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLACKSITE">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>BLACKSITE — Tactical FPS</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230b0d0e'/%3E%3Ccircle cx='90' cy='90' r='54' fill='none' stroke='%23ff7a1a' stroke-width='7'/%3E%3Cpath d='M90 22v34M90 124v34M22 90h34M124 90h34' stroke='%23ff7a1a' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8e6e1}
  body{position:fixed;inset:0}
  #app{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- boot / loading ---------- */
  #boot{position:absolute;inset:0;z-index:900;background:
      radial-gradient(120% 90% at 50% 0%,#16191c 0%,#08090a 55%,#000 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    transition:opacity .55s ease}
  #boot.hide{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(30px,9vw,64px);letter-spacing:.30em;font-weight:800;
    text-indent:.30em;color:#f2efe9;text-shadow:0 0 34px rgba(255,122,26,.42)}
  #boot .sub{font-size:11px;letter-spacing:.42em;color:#ff7a1a;text-indent:.42em;opacity:.92}
  #bar{width:min(340px,62vw);height:2px;background:#24282c;overflow:hidden;border-radius:2px}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff7a1a,#ffc46b);
    transition:width .3s ease;box-shadow:0 0 12px rgba(255,122,26,.8)}
  #bootmsg{font-size:10px;letter-spacing:.22em;color:#6d7479;height:12px}

  /* ---------- rotate prompt ---------- */
  #rotate{position:absolute;inset:0;z-index:950;background:#000;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:32px}
  #rotate svg{width:78px;height:78px;stroke:#ff7a1a;fill:none;stroke-width:5;animation:tilt 2.1s ease-in-out infinite}
  @keyframes tilt{0%,42%{transform:rotate(0)}58%,100%{transform:rotate(-90deg)}}
  #rotate p{font-size:12px;letter-spacing:.26em;color:#9aa1a6;line-height:2}
  body.portrait-lock #rotate{display:flex}

  #err{position:absolute;inset:0;z-index:990;background:#0a0b0c;display:none;padding:28px;
    flex-direction:column;justify-content:center;gap:14px;font-size:12px;line-height:1.7;color:#ff9a9a}
  #err b{color:#ff7a1a;letter-spacing:.2em;font-size:13px}
  #err pre{white-space:pre-wrap;word-break:break-word;color:#8c9297;font-size:10.5px;max-height:46vh;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>

<div id="boot">
  <div class="sub">TACTICAL OPERATIONS</div>
  <h1>BLACKSITE</h1>
  <div id="bar"><i></i></div>
  <div id="bootmsg">INITIALIZING</div>
</div>

<div id="rotate">
  <svg viewBox="0 0 100 100" stroke-linejoin="round" stroke-linecap="round">
    <rect x="30" y="12" width="40" height="76" rx="7"/><path d="M43 78h14"/>
  </svg>
  <p>ROTATE DEVICE<br>LANDSCAPE REQUIRED</p>
</div>

<div id="err"><b>SYSTEM FAULT</b><pre id="errtext"></pre></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  const errBox = document.getElementById('err');
  const errTxt = document.getElementById('errtext');
  function fail(e){
    errBox.style.display = 'flex';
    errTxt.textContent = (e && (e.stack || e.message)) || String(e);
    console.error(e);
  }
  window.addEventListener('error', ev => fail(ev.error || ev.message));
  window.addEventListener('unhandledrejection', ev => fail(ev.reason));
  try {
    const { boot } = await import('./src/main.js');
    await boot();
  } catch (e) { fail(e); }
</script>
</body>
</html>
